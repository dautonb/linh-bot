name: Linh Voice Bot (chỉ model free)

on:
  # Chạy thủ công lần đầu, và để mỗi lượt tự kích hoạt lượt kế tiếp
  workflow_dispatch:
  # Dự phòng: mỗi giờ thử khởi động lại nếu chuỗi tự nối bị đứt
  # (nếu đang có lượt chạy thì lượt mới tự xếp hàng chờ, không chạy chồng)
  schedule:
    - cron: "15 * * * *"

# Chỉ cho phép 1 lượt chạy cùng lúc. Lượt mới xếp hàng chờ, KHÔNG hủy lượt đang chạy,
# nhờ vậy 2 bot không bao giờ tranh nhau getUpdates (lỗi 409).
concurrency:
  group: linh-free-bot
  cancel-in-progress: false

permissions:
  actions: write    # Để tự kích hoạt lượt kế tiếp
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # Giới hạn cứng của GitHub là 360 phút

    env:
      # Toàn bộ khóa bí mật + nội dung nhân vật lấy từ Settings > Secrets (repo public không lộ gì)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # Một khóa OpenRouter dùng cho cả chat lẫn giọng nói (đều là model free)
      STATE_REPO: ${{ secrets.STATE_REPO }}
      STATE_REPO_TOKEN: ${{ secrets.STATE_REPO_TOKEN }}
      SYSTEM_PROMPT: ${{ secrets.SYSTEM_PROMPT }}
      STYLE_REMINDER: ${{ secrets.STYLE_REMINDER }}
      PROACTIVE_INSTRUCTION: ${{ secrets.PROACTIVE_INSTRUCTION }}
      # --- Chat: chuỗi model FREE, thử lần lượt (chỉ nhận ID đuôi :free hoặc openrouter/free) ---
      # Danh sách free đổi liên tục, cập nhật theo openrouter.ai/collections/free-models. Mỗi model free chỉ có 1 nhà cung cấp nên cần nhiều model dự phòng.
      LLM_MODELS: "google/gemma-4-31b-it:free,nvidia/nemotron-3.5-lightning:free,dots-studio/dots-3-note-preview:free,nvidia/nemotron-3-ultra-550b-a55b:free,google/gemma-4-26b-a4b-it:free,openrouter/free"
      LLM_MAX_TOKENS: "1500"      # Dư để model có suy luận vẫn còn chỗ viết câu trả lời
      LLM_TEMPERATURE: "0.9"
      LLM_CONTEXT_CHARS: "12000"  # Tổng ký tự (persona + lịch sử) gửi đi mỗi lần
      LLM_MAX_TRIES: "3"          # Tối đa bao nhiêu model được thử cho mỗi tin (mỗi lần thử tốn 1 lượt free)
      LLM_DATA_COLLECTION: "-"    # "deny" = chỉ dùng nhà cung cấp không lưu dữ liệu (an toàn nhưng còn rất ít model free); "-" = theo cài đặt tài khoản
      # --- Hạn mức free: 20 yêu cầu/phút; 50/ngày UTC (chưa mua đủ 10 credit) hoặc 1000/ngày (đã mua từ 10 credit). Dùng chung cho chat + giọng nói ---
      FREE_DAILY_LIMIT: "50"      # Đổi thành 1000 nếu bạn đã mua từ 10 credit; 0 = không tự giới hạn
      VOICE_RESERVE: "10"         # Chừa lượt cuối ngày cho chat chữ: hết ngưỡng này bot ngừng làm giọng nói và ngừng nhắn trước
      # --- Giọng nói: chuỗi model TTS FREE, thử lần lượt ---
      # HeyGen free bị gỡ ngày 30/11/2026, sau đó bot tự dùng Fish Audio free ở vị trí kế tiếp
      TTS_MODELS: "heygen/heygen-voice-1-turbo:free,fish-audio/s2.1-pro-free:free"
      # HeyGen: nadine, tabitha, bram, gareth, noelle, meredith, sabrina, lucian, weston, vincent
      HEYGEN_VOICE: "meredith"
      # Fish Audio: ID giọng 32 ký tự từ fish.audio ("Copy Model Id"); để trống = giọng mặc định
      FISH_VOICE: ""
      TTS_PCM_RATE: "44100"       # Tần số mẫu PCM của HeyGen. Nghe giọng nhanh/chậm/méo thì thử 24000 hoặc 22050
      TTS_FORCE_OGG: "0"          # "1" = đổi mp3 (Fish) sang ogg/opus nếu Telegram hiện mp3 như bài nhạc thay vì bong bóng voice
      SEND_TEXT_ALSO: "0"         # "1" = gửi thêm bản chữ ngay sau mỗi tin voice
      # STATE_FILE: "state_free.json"   # Bỏ comment nếu muốn bản này có bộ nhớ riêng, không dùng chung với bot cũ
      RUN_SECONDS: "20400"        # Bot tự thoát sau 5h40m để còn kịp nối lượt kế tiếp
      TZ_OFFSET_HOURS: "7"        # Múi giờ Việt Nam (UTC+7) để tính giờ yên lặng
      PYTHONUNBUFFERED: "1"       # In log ra ngay, không bị giữ đệm
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện
        run: pip install -r requirements.txt

      # BẮT BUỘC khi dùng HeyGen: HeyGen chỉ trả PCM thô, bot dùng ffmpeg đổi sang ogg/opus để Telegram phát được (Fish thì mp3 gửi thẳng).
      # Máy đã có sẵn ffmpeg thì bước này bỏ qua ngay.
      - name: Cài ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Chạy bot
        id: bot
        run: |
          start=$(date +%s)
          python bot.py && code=0 || code=$?
          echo "elapsed=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          exit $code

      # Tự kích hoạt lượt kế tiếp. Chỉ làm khi lượt này đã chạy > 5 phút:
      # nếu bot chết ngay lúc khởi động (sai secret...) thì DỪNG nối để không lặp vô hạn
      # và không chạy khi bạn bấm Cancel -> đây cũng là cách dừng bot.
      - name: Kích hoạt lượt kế tiếp
        if: ${{ (success() || failure()) && steps.bot.outputs.elapsed > 300 }}
        run: gh workflow run bot.yml --repo "$GITHUB_REPOSITORY"
